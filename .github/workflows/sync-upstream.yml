name: Sync upstream

on:
  schedule:
    # GitHub Actions có jitter nên cron */15 sẽ chạy trễ vài phút mỗi lần.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Push bằng GITHUB_TOKEN không kích hoạt workflow khác (chống đệ quy),
  # nên cần quyền này để dispatch build-omp-x64 thủ công sau khi sync.
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/can1357/oh-my-pi.git

      - name: Merge upstream/main into master
        run: |
          git fetch upstream main --tags
          if git merge --no-edit upstream/main; then
            echo "Đã merge upstream/main vào master (fast-forward hoặc merge sạch)."
          else
            echo "::error::Merge conflict với upstream/main — cần resolve thủ công."
            git merge --abort
            exit 1
          fi

      - name: Push to origin
        id: push
        run: |
          if [ "$(git rev-list --count origin/master..master)" -gt 0 ]; then
            git push origin master
            echo "did_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "Đã đồng bộ, không có commit mới để push."
            echo "did_push=false" >> "$GITHUB_OUTPUT"
          fi

      # Push bằng GITHUB_TOKEN không tự kích hoạt on: push workflow khác
      # (GitHub chống đệ quy), nên dispatch trực tiếp khi vừa có commit mới.
      - name: Trigger build x64
        if: steps.push.outputs.did_push == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-omp-x64.yml --repo "$GITHUB_REPOSITORY" --ref master
