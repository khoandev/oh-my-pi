name: Build OMP x64

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-x64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
            binary: omp-linux-x64
            native_targets: linux-x64-baseline linux-x64-modern

          - os: macos-15-intel
            target: darwin-x64
            binary: omp-darwin-x64
            native_targets: darwin-x64-baseline

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - name: Cache Bun
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-x64-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-x64-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # GitHub-hosted runners get no vmon Bazel cache, so every run re-downloads
      # the rust toolchain and crate archives. Cache Bazel's repository cache of
      # those verified downloads; a warm entry removes the network dependency
      # that failed run 44737528274 (static.rust-lang.org connect timeout).
      - name: Cache Bazel repository downloads
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel-repo-cache
          key: bazel-repo-${{ matrix.target }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelversion') }}
          restore-keys: |
            bazel-repo-${{ matrix.target }}-

      # Build native .node files directly.
      # Không phụ thuộc artifact từ job khác.
      - id: cache
        uses: ./.github/actions/bazel-cache

      - name: Build native addons
        shell: bash
        env:
          OMP_BAZEL_RC: ${{ steps.cache.outputs.rc }}
          NATIVE_TARGETS: ${{ matrix.native_targets }}
        run: |
          set -euo pipefail
          # Raise-only fd guard: huge toolchain input trees exhaust low soft
          # limits during sandbox setup. Runs in the step that launches the
          # bazel server (limits are per-process and the server persists).
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
          read -r -a targets <<< "$NATIVE_TARGETS"
          log="$RUNNER_TEMP/bazel-build.log"
          # Retry only transient repository-fetch failures: the runner has no
          # warm Bazel cache on the first run for a lockfile state, and Bazel's
          # own downloader retries were exhausted by a multi-minute outage. A
          # deterministic failure (compile error, bad target) fails immediately.
          for attempt in 1 2 3; do
            status=0
            bun scripts/bazel-natives.ts "${targets[@]}" --dest packages/natives/native \
              -- --repository_cache="$HOME/.cache/bazel-repo-cache" 2>&1 | tee "$log" || status=$?
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -eq 3 ] || ! grep -Eq 'Connect timed out|SocketException|Connection reset|failed to fetch|Download from .* failed|HTTP (5[0-9][0-9]|timeout)' "$log"; then
              exit "$status"
            fi
            echo "::warning title=Build native addons::transient download failure (attempt $attempt/3); retrying"
            sleep 30
          done

      - name: Build ${{ matrix.target }}
        env:
          RELEASE_TARGETS: ${{ matrix.target }}
        run: bun run ci:release:build-binaries

      - name: Smoke test
        shell: bash
        run: |
          set -e
          chmod +x packages/coding-agent/binaries/${{ matrix.binary }}

          runtime_dir="$(mktemp -d)"
          HOME="$runtime_dir/home" \
          XDG_DATA_HOME="$runtime_dir/xdg" \
          packages/coding-agent/binaries/${{ matrix.binary }} --version

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: packages/coding-agent/binaries/${{ matrix.binary }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
